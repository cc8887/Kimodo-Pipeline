[paths]
# Relative paths are resolved against the standalone repository directory.
asset_root = "workspace/als"
reference_root = "workspace/als"
work_root = "workspace/runs"
# Place the consumer and Windows Kimodo beside this repository, or edit the
# ignored local copy to match your layout.
project_root = "../Godot-Locomotion"
kimodo_repo = "../kimodo"
python = "../kimodo/.venv/Scripts/python.exe"
runtime_python = ".venv-win/Scripts/python.exe"
godot = "../Godot-Locomotion/Godot_v4.7.2-stable_mono_win64/Godot_v4.7.2-stable_mono_win64_console.exe"
# PowerShell: $env:KIMODO_DOTNET = (Get-Command dotnet.exe).Source
dotnet = "${KIMODO_DOTNET}"
